<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      const pendingClientBundles = [];
      window.__ModuleLoader__ = {
        mode: 'queue',
        pendingQueue: pendingClientBundles,
        load(registration) {
          if (this.mode !== 'queue') throw new Error('Client module bootstrap is already complete');
          pendingClientBundles.push(registration);
        },
      };
    </script>
    <title>Harness Plugin UI</title>
  </head>
  <body>
    <main id="root"></main>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
